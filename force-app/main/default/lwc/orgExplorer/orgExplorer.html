<template>
    <div>
        <div class="slds-m-bottom_large">
            <h1 class="slds-text-heading_large">Org Explorer</h1>
            <p class="slds-m-top_small">
                Search a Salesforce object to understand fields, relationships, automation, permissions, and risks.
            </p>
        </div>

        <div class="slds-box slds-m-bottom_large">
            <lightning-input
                label="Object Name"
                value={orgInput}
                onchange={handleOrgInputChange}
                placeholder="Example: Opportunity, Case, Account, Contact">
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button label="Explore Object" variant="brand" onclick={exploreObject}></lightning-button>
            </div>
        </div>

        <template if:true={showOrgAnalysis}>
            <div class="slds-grid slds-wrap slds-gutters">

                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                    <lightning-card title="Object Health">
                        <div class="slds-p-around_medium slds-text-align_center">
                            <h2 class="slds-text-heading_large">{orgAnalysis.healthScore}</h2>
                            <p class="slds-text-heading_small">{orgAnalysis.impactLevel}</p>
                        </div>

                        <div class="slds-p-around_medium">
                            <p><strong>Object:</strong> {orgAnalysis.objectName}</p>
                            <p><strong>API Name:</strong> {orgAnalysis.objectApiName}</p>
                            <p><strong>Type:</strong> {orgAnalysis.objectType}</p>
                            <p><strong>Fields:</strong> {orgAnalysis.fieldCount}</p>
                            <p><strong>Relationships:</strong> {orgAnalysis.relationships}</p>
                            <p><strong>Validation Rules:</strong> {orgAnalysis.validationRules}</p>
                            <p><strong>Record Types:</strong> {orgAnalysis.recordTypes}</p>
                            <p><strong>Flows:</strong> {orgAnalysis.flows}</p>
                            <p><strong>Page Layouts:</strong> {orgAnalysis.pageLayouts}</p>
                            <p><strong>Permissions:</strong> {orgAnalysis.permissions}</p>
                        </div>
                    </lightning-card>

                    <lightning-card title="Relationship Map" class="slds-m-top_medium">
                        <div class="slds-p-around_medium">
                            <template for:each={orgAnalysis.relationshipMap} for:item="relationship">
                                <p key={relationship}>🔗 {relationship}</p>
                            </template>
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3">
                    <lightning-card title="Org Explorer Analysis">
                        <div class="slds-p-around_medium">{orgAnalysis.summary}</div>
                    </lightning-card>

                    <lightning-card title="Field Explorer" class="slds-m-top_medium">
                        <div class="slds-p-around_medium">
                            <template for:each={orgAnalysis.fields} for:item="field">
                                <div key={field.apiName} class="field-card">
                                    <p class="field-title">{field.label}</p>
                                    <p class="field-api">API Name: {field.apiName}</p>

                                    <div class="badge-row">
                                        <span class="field-badge">Type: {field.type}</span>
                                        <span class="field-badge">Required: {field.required}</span>
                                        <span class="field-badge">Custom: {field.custom}</span>
                                        <span class="field-badge">Createable: {field.createable}</span>
                                        <span class="field-badge">Updateable: {field.updateable}</span>
                                        <span class="field-badge">Calculated: {field.calculated}</span>
                                        <span class="field-badge">Unique: {field.unique}</span>
                                        <span class="field-badge">External ID: {field.externalId}</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </lightning-card>

                    <lightning-card title="Automation Inventory" class="slds-m-top_medium">
                        <div class="slds-p-around_medium">
                            <template for:each={orgAnalysis.automationInventory} for:item="automation">
                                <p key={automation}>⚙️ {automation}</p>
                            </template>
                        </div>
                    </lightning-card>

                    <lightning-card title="Risks" class="slds-m-top_medium">
                        <div class="slds-p-around_medium">
                            <template for:each={orgAnalysis.risks} for:item="risk">
                                <p key={risk}>⚠ {risk}</p>
                            </template>
                        </div>
                    </lightning-card>

                    <lightning-card title="AI Recommendations" class="slds-m-top_medium">
                        <div class="slds-p-around_medium">
                            <template for:each={orgAnalysis.recommendations} for:item="recommendation">
                                <p key={recommendation}>✅ {recommendation}</p>
                            </template>
                        </div>
                    </lightning-card>
                </div>

            </div>
        </template>
    </div>
</template>
