<template>
  <section class="morning-brief" aria-labelledby="morning-brief-title">
    <header>
      <div>
        <p class="eyebrow">Morning briefing</p>
        <h1 id="morning-brief-title">{greeting}, {userName}</h1>
        <p>{formattedDate}</p>
      </div>
      <div class="source">
        <strong>{dataSourceLabel}</strong>
        <template if:true={lastUpdatedLabel}>
          <span>Updated {lastUpdatedLabel}</span>
        </template>
      </div>
    </header>

    <template if:true={isLoading}>
      <div class="state" role="status">
        <lightning-spinner
          alternative-text="Preparing your morning briefing"
          size="small"
        ></lightning-spinner>
        <span>Reviewing the shared metadata snapshot…</span>
      </div>
    </template>

    <template if:true={hasError}>
      <div class="state error" role="alert">
        <span>{errorMessage}</span>
        <lightning-button
          label="Retry"
          onclick={handleRetry}
        ></lightning-button>
      </div>
    </template>

    <template if:true={hasAnalysis}>
      <section class="executive-summary" aria-labelledby="executive-title">
        <p class="eyebrow">Executive Summary</p>
        <h2 id="executive-title">{executiveSummary}</h2>
        <p>
          Start with the prioritized work below, then use the suggested
          workspace for deeper review.
        </p>
      </section>

      <div class="summary-grid">
        <article class="healthy-summary">
          <p class="eyebrow">Org Health</p>
          <h2>{orgHealthStatus}</h2>
          <p>{orgHealthMessage}</p>
        </article>
        <article>
          <p class="eyebrow">Metadata Coverage</p>
          <h2>{metadataCoverageLabel}</h2>
          <p>{metadataCoverageDetail}</p>
        </article>
      </div>

      <c-admin-task-center
        analysis-result={analysisResult}
        source-workspace="dailyBrief"
        onworkspacenavigate={handleWorkspaceNavigate}
      ></c-admin-task-center>

      <div class="operations-grid">
        <section aria-labelledby="documentation-title">
          <h2 id="documentation-title">Documentation Gaps</h2>
          <template if:true={hasDocumentationGaps}>
            <ul>
              <template for:each={documentationGaps} for:item="gap">
                <li key={gap.id}>{gap.label}</li>
              </template>
            </ul>
          </template>
          <template if:false={hasDocumentationGaps}>
            <p>No documentation gaps were identified in current coverage.</p>
          </template>
        </section>

        <section aria-labelledby="readiness-title">
          <h2 id="readiness-title">Deployment Readiness</h2>
          <strong>{deploymentReadinessStatus}</strong>
          <p>{deploymentReadinessNotice}</p>
        </section>

        <section aria-labelledby="findings-title">
          <h2 id="findings-title">Recent Findings</h2>
          <template if:true={hasTopFindings}>
            <ul>
              <template for:each={topFindings} for:item="finding">
                <li key={finding.id}>
                  <span>{finding.label}</span>
                  <lightning-button
                    label="Explain This"
                    variant="base"
                    data-id={finding.id}
                    onclick={handleFindingExplain}
                  ></lightning-button>
                </li>
              </template>
            </ul>
          </template>
          <template if:false={hasTopFindings}>
            <p>No findings require attention in the current coverage.</p>
          </template>
        </section>

        <section class="suggested-workspace" aria-labelledby="suggested-title">
          <h2 id="suggested-title">Suggested Workspace</h2>
          <strong>{recommendedActionTitle}</strong>
          <p>{recommendedActionDescription}</p>
          <lightning-button
            label="Open Recommended Workspace"
            variant="brand"
            onclick={handleRecommendedAction}
          ></lightning-button>
        </section>

        <section class="end-of-day" aria-labelledby="end-of-day-title">
          <h2 id="end-of-day-title">End-of-Day Checklist</h2>
          <template if:true={hasEndOfDayChecklist}>
            <ul>
              <template for:each={endOfDayChecklist} for:item="item">
                <li key={item.id}>{item.label}</li>
              </template>
            </ul>
          </template>
          <template if:false={hasEndOfDayChecklist}>
            <p>
              No verified checklist items are available from the current
              analysis.
            </p>
          </template>
        </section>
      </div>
    </template>
  </section>
</template>
