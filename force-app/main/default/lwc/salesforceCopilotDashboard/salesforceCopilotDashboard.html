<template>
  <div class="app-shell">
    <template if:true={showDashboard}>
      <header class="hero" aria-labelledby="workspace-title">
        <div class="hero-copy">
          <p class="eyebrow">Salesforce Administration Workspace</p>
          <h1 id="workspace-title">Plan, understand, and manage Salesforce</h1>
          <p class="hero-purpose">
            A deterministic workspace for safer administration and clearer
            system understanding.
          </p>
        </div>
        <dl class="hero-status" aria-label="Admin Operations Snapshot">
          <div class="kpi-card kpi-card-attention">
            <dt>Org Health</dt>
            <dd class="kpi-value">{healthScoreLabel}</dd>
            <dd class="kpi-context">{healthContextLabel}</dd>
            <dd class="kpi-action">
              <lightning-button
                label="Review Org Health →"
                variant="base"
                data-module="orgHealthDashboard"
                onclick={handleWorkspaceLaunch}
              ></lightning-button>
            </dd>
          </div>
          <div class="kpi-card kpi-card-attention">
            <dt>High Priority</dt>
            <dd class="kpi-value">{highPriorityLabel}</dd>
            <dd class="kpi-context">{highPriorityContextLabel}</dd>
          </div>
          <div class="kpi-card">
            <dt>Recommended Actions</dt>
            <dd class="kpi-value">{recommendedActionsLabel}</dd>
            <dd class="kpi-context">{recommendedActionsContextLabel}</dd>
          </div>
          <div class="kpi-card kpi-card-timestamp">
            <dt>Last Analysis</dt>
            <dd class="kpi-value">{lastAnalysisLabel}</dd>
            <dd class="kpi-context">{lastAnalysisContextLabel}</dd>
          </div>
        </dl>
      </header>

      <section class="dashboard-section brief-section">
        <c-daily-brief-summary
          onworkspacenavigate={handleWorkspaceNavigate}
          onbriefstatus={handleBriefStatus}
        ></c-daily-brief-summary>
      </section>

      <section class="status-strip" aria-labelledby="health-snapshot-title">
        <div class="status-strip-heading">
          <p class="eyebrow">Organization state</p>
          <h2 id="health-snapshot-title">Org Health</h2>
        </div>
        <div class="health-value">
          <strong>{healthScoreLabel}</strong>
          <span>{healthStatus}</span>
        </div>
        <p class="status-summary">{riskNotice}</p>
        <lightning-button
          label="Review Org Health →"
          variant="base"
          data-module="orgHealthDashboard"
          onclick={handleWorkspaceLaunch}
        ></lightning-button>
      </section>

      <section class="planning-strip" aria-labelledby="featured-ask-title">
        <div>
          <p class="eyebrow">Plan a change</p>
          <h2 id="featured-ask-title">{featuredAskBeforeYouBuild.title}</h2>
          <p>
            Define the business problem, affected users, success measures, and
            design considerations before configuring Salesforce.
          </p>
        </div>
        <lightning-button
          label="Start Planning →"
          variant="brand"
          onclick={handleFeaturedAsk}
        ></lightning-button>
      </section>

      <nav class="utility-actions" aria-label="Mission Control utilities">
        <div>
          <p class="eyebrow">Deeper tools</p>
          <h2>Utility Actions</h2>
        </div>
        <div class="utility-buttons">
          <template for:each={utilityActions} for:item="action">
            <lightning-button
              key={action.moduleName}
              label={action.label}
              variant={action.variant}
              icon-name={action.iconName}
              data-module={action.moduleName}
              onclick={handlePrimaryAction}
            ></lightning-button>
          </template>
        </div>
      </nav>
    </template>

    <template if:true={showWorkspaceRouter}>
      <c-copilot-workspace-router
        current-view={currentView}
        workspace-context={workspaceContext}
        onworkspacenavigate={handleWorkspaceNavigate}
        onbacktodashboard={backToDashboard}
      ></c-copilot-workspace-router>
    </template>
  </div>
</template>
