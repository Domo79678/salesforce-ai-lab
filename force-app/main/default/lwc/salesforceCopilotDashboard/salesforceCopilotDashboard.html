<template>
  <div class="app-shell">
    <template if:true={showDashboard}>
      <header class="hero" aria-labelledby="workspace-title">
        <div>
          <p class="eyebrow">Salesforce Administration Workspace</p>
          <h1 id="workspace-title">Plan, understand, and manage Salesforce</h1>
          <p class="hero-purpose">
            A deterministic workspace for safer administration and clearer
            system understanding.
          </p>
        </div>
        <dl class="hero-status" aria-label="Workspace status">
          <div>
            <dt>Org Health</dt>
            <dd>{healthScoreLabel}</dd>
          </div>
          <div>
            <dt>High Priority</dt>
            <dd>{highPriorityLabel}</dd>
          </div>
          <div>
            <dt>Recommended Actions</dt>
            <dd>{recommendedActionsLabel}</dd>
          </div>
          <div>
            <dt>Last Analysis</dt>
            <dd>{lastAnalysisLabel}</dd>
          </div>
        </dl>
      </header>

      <section class="dashboard-section">
        <c-daily-brief-summary
          onworkspacenavigate={handleWorkspaceNavigate}
          onbriefstatus={handleBriefStatus}
        ></c-daily-brief-summary>
      </section>

      <section class="dashboard-section">
        <article
          class="health-snapshot"
          aria-labelledby="health-snapshot-title"
        >
          <p class="eyebrow">Organization state</p>
          <h2 id="health-snapshot-title">Org Health Snapshot</h2>
          <div class="health-value">
            <strong>{healthScoreLabel}</strong>
            <span>{healthStatus}</span>
          </div>
          <p>{riskNotice}</p>
          <lightning-button
            label="Review Org Health"
            data-module="orgHealthDashboard"
            onclick={handleWorkspaceLaunch}
          ></lightning-button>
        </article>
      </section>

      <section class="featured-planning" aria-labelledby="featured-ask-title">
        <div class="featured-icon">
          <lightning-icon
            icon-name="utility:choice"
            size="medium"
            alternative-text="Planning"
          ></lightning-icon>
        </div>
        <div>
          <p class="eyebrow">Featured planning workspace</p>
          <h2 id="featured-ask-title">{featuredAskBeforeYouBuild.title}</h2>
          <p>
            Think through the business problem, affected users, design choices,
            and testing plan before configuring Salesforce.
          </p>
        </div>
        <lightning-button
          label="Start Planning"
          variant="brand"
          onclick={handleFeaturedAsk}
        ></lightning-button>
      </section>

      <section
        class="dashboard-section"
        aria-labelledby="primary-actions-title"
      >
        <div class="section-heading">
          <div>
            <p class="eyebrow">Start here</p>
            <h2 id="primary-actions-title">Primary Actions</h2>
          </div>
        </div>
        <div class="primary-grid">
          <template for:each={primaryActions} for:item="action">
            <article key={action.moduleName} class="action-card">
              <lightning-icon
                icon-name={action.iconName}
                size="small"
                alternative-text={action.label}
              ></lightning-icon>
              <div>
                <h3>{action.label}</h3>
                <p>{action.description}</p>
              </div>
              <lightning-button
                label={action.label}
                variant={action.variant}
                data-module={action.moduleName}
                onclick={handlePrimaryAction}
              ></lightning-button>
            </article>
          </template>
        </div>
      </section>

      <section class="dashboard-section" aria-labelledby="workspaces-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Where to go</p>
            <h2 id="workspaces-title">Explore More</h2>
          </div>
          <lightning-button
            label="View All Tools"
            icon-name="utility:apps"
            onclick={handleViewAllTools}
          ></lightning-button>
        </div>

        <div class="workspace-grid">
          <template for:each={workspacePreview} for:item="workspace">
            <article key={workspace.name} class="workspace-link">
              <lightning-icon
                icon-name={workspace.iconName}
                size="x-small"
                alternative-text=""
              ></lightning-icon>
              <h3>{workspace.title}</h3>
              <lightning-button
                label="Open"
                variant="base"
                data-module={workspace.name}
                onclick={handleWorkspaceLaunch}
              ></lightning-button>
            </article>
          </template>
        </div>
      </section>

      <footer class="developer-link">
        <details>
          <summary>Developer Tools</summary>
          <div>
            <p>
              Technical diagnostics are kept outside administrator workflows.
            </p>
            <lightning-button
              label="Open Developer Tools"
              icon-name="utility:setup"
              variant="base"
              onclick={handleDeveloperTools}
            ></lightning-button>
          </div>
        </details>
      </footer>
    </template>

    <template if:true={showWorkspaceRouter}>
      <c-copilot-workspace-router
        current-view={currentView}
        workspace-context={workspaceContext}
        onworkspacenavigate={handleWorkspaceNavigate}
        onbacktodashboard={backToDashboard}
      ></c-copilot-workspace-router>
    </template>
  </div>
</template>
