<template>
  <lightning-card>
    <div class="viewer-container">
      <!-- Header -->
      <section class="hero-panel">
        <div class="hero-content">
          <div>
            <p class="eyebrow">Salesforce Copilot</p>

            <h1 class="hero-title">Org Knowledge</h1>

            <p class="hero-description">
              Build and expose a reusable understanding of the connected
              Salesforce org for administration workflows.
            </p>
          </div>

          <div class="hero-actions">
            <lightning-button
              label="Refresh Knowledge"
              variant="brand"
              icon-name="utility:refresh"
              onclick={handleRefresh}
              disabled={isLoading}
            >
            </lightning-button>
          </div>
        </div>
      </section>

      <!-- Messages -->
      <template if:true={errorMessage}>
        <div class="message-panel error-message" role="alert">
          <lightning-icon
            icon-name="utility:error"
            size="x-small"
            alternative-text="Error"
          >
          </lightning-icon>

          <span>{errorMessage}</span>
        </div>
      </template>

      <template if:true={successMessage}>
        <div class="message-panel success-message" role="status">
          <lightning-icon
            icon-name="utility:success"
            size="x-small"
            alternative-text="Success"
          >
          </lightning-icon>

          <span>{successMessage}</span>
        </div>
      </template>

      <!-- Loading -->
      <template if:true={isLoading}>
        <section class="loading-panel">
          <lightning-spinner
            alternative-text="Loading Org Knowledge analysis"
            size="medium"
          >
          </lightning-spinner>

          <div class="loading-copy">
            <h2>Analyzing Salesforce metadata</h2>

            <p>
              Loading organization context, object details, fields,
              relationships, record types, and live Flow metadata before
              recalculating Org Health, Deployment Readiness, and Metadata
              Coverage.
            </p>
          </div>
        </section>
      </template>

      <!-- Empty state -->
      <template if:false={isLoading}>
        <template if:false={hasAnalysis}>
          <section class="empty-state">
            <lightning-icon
              icon-name="utility:knowledge_base"
              size="large"
              alternative-text="Org Knowledge"
            >
            </lightning-icon>

            <h2>No Org Knowledge analysis is loaded</h2>

            <p>
              Run the analysis to retrieve live Salesforce metadata and generate
              findings, recommendations, health scores, deployment guidance, and
              metadata coverage.
            </p>

            <lightning-button
              label="Run Org Knowledge Analysis"
              variant="brand"
              icon-name="utility:play"
              onclick={handleRefresh}
            >
            </lightning-button>
          </section>
        </template>
      </template>

      <!-- Results -->
      <template if:true={hasAnalysis}>
        <!-- Persistent organization identity -->
        <section class="identity-panel">
          <div>
            <p class="eyebrow dark-eyebrow">Connected Org</p>

            <h2 class="organization-name">{organizationName}</h2>

            <p class="identity-description">{coverageLabel}</p>
          </div>

          <div class="identity-meta">
            <div>
              <span class="meta-label"> Source </span>

              <strong> {sourceLabel} </strong>
            </div>
            <div>
              <span class="meta-label"> Scan Mode </span>

              <strong> {scanMode} </strong>
            </div>

            <div>
              <span class="meta-label"> Generated </span>

              <strong> {generatedAtLabel} </strong>
            </div>

            <div>
              <span class="meta-label"> Analysis Time </span>

              <strong> {analysisDurationLabel} </strong>
            </div>
          </div>
        </section>

        <!-- Tabbed workspace -->
        <lightning-tabset
          variant="scoped"
          active-tab-value={activeTabValue}
          onactive={handleTabChange}
        >
          <!-- Overview -->
          <lightning-tab
            label="Overview"
            value="overview"
            icon-name="utility:home"
          >
            <div class="tab-workspace">
              <section
                class="knowledge-snapshot"
                aria-labelledby="snapshot-title"
              >
                <div class="overview-heading">
                  <p class="eyebrow dark-eyebrow">CURRENT UNDERSTANDING</p>
                  <h2 id="snapshot-title" class="section-title">
                    Knowledge Snapshot
                  </h2>
                </div>
                <div class="snapshot-grid">
                  <article class="snapshot-item snapshot-health">
                    <span class="metric-label">Org Health</span>
                    <strong>{orgHealthDisplay}</strong>
                    <span>{orgHealthStatus}</span>
                  </article>
                  <article class="snapshot-item">
                    <span class="metric-label">Knowledge Coverage</span>
                    <strong>{knowledgeCoverageDisplay}</strong>
                    <span>{knowledgeCoverageStatus}</span>
                  </article>
                  <article class="snapshot-item">
                    <span class="metric-label">Findings</span>
                    <strong>{totalFindings}</strong>
                    <span>{blockingFindings} blocking</span>
                  </article>
                  <article class="snapshot-item snapshot-readiness">
                    <span class="metric-label">Deployment Readiness</span>
                    <strong>{deploymentScoreDisplay}</strong>
                    <span>{deploymentStatus}</span>
                  </article>
                </div>
              </section>

              <section
                class="what-we-know"
                aria-labelledby="what-we-know-title"
              >
                <div class="overview-heading">
                  <p class="eyebrow dark-eyebrow">DETERMINISTIC INSIGHTS</p>
                  <h2 id="what-we-know-title" class="section-title">
                    What We Know
                  </h2>
                </div>
                <div class="focus-grid">
                  <article class="focus-card">
                    <span class="focus-label"> Needs Attention </span>

                    <strong> {lowestCategory} </strong>

                    <p>Lowest health category: {lowestCategoryScore}/100</p>
                  </article>

                  <article class="focus-card">
                    <span class="focus-label"> Highest-Risk Category </span>

                    <strong> {highestRiskCategory} </strong>

                    <p>Risk level: {highestRiskLevel}</p>
                  </article>

                  <article class="focus-card">
                    <span class="focus-label"> Coverage </span>
                    <strong>{knowledgeCoverageDisplay} objects</strong>
                    <p>
                      {totalFields} fields analyzed. {knowledgeCoverageStatus}.
                    </p>
                  </article>
                  <article class="focus-card">
                    <span class="focus-label"> Blockers </span>
                    <strong>{blockingFindings}</strong>
                    <p>Blocking findings in the current analysis.</p>
                  </article>
                </div>
              </section>

              <section
                class="overview-drilldowns"
                aria-label="Knowledge drill-downs"
              >
                <div>
                  <h2 class="section-title">Coverage Awareness</h2>
                  <p>
                    {coverageLabel}. {totalFields} fields analyzed.
                    {knowledgeCoverageStatus}.
                  </p>
                  <lightning-button
                    variant="base"
                    label="Explore Coverage →"
                    data-tab="coverage"
                    onclick={handleSelectTab}
                  ></lightning-button>
                </div>
                <div>
                  <h2 class="section-title">Findings</h2>
                  <p>
                    {totalFindings} total findings; {blockingFindings} blocking.
                  </p>
                  <lightning-button
                    variant="base"
                    label="Review Findings →"
                    data-tab="findings"
                    onclick={handleSelectTab}
                  ></lightning-button>
                </div>
              </section>

              <section class="content-panel shared-engine-panel">
                <div class="panel-header">
                  <div>
                    <h2 class="section-title">Used Across Your Workspace</h2>

                    <p class="panel-description">
                      Analyze the org once and reuse that knowledge across
                      supported administration workflows.
                    </p>
                  </div>

                  <lightning-icon
                    icon-name="utility:connected_apps"
                    size="small"
                    alternative-text="Shared Intelligence"
                  >
                  </lightning-icon>
                </div>

                <div class="metric-grid">
                  <article class="metric-card">
                    <span class="metric-label"> Explain This </span>

                    <strong class="shared-feature-status">
                      Knowledge Ready
                    </strong>

                    <span class="metric-detail">
                      Uses object, field, and Flow profiles with risks,
                      recommendations, and tests.
                    </span>
                  </article>

                  <article class="metric-card">
                    <span class="metric-label"> Change Impact </span>

                    <strong class="shared-feature-status">
                      Knowledge Ready
                    </strong>

                    <span class="metric-detail">
                      Uses entity risk, structural metadata, dependencies, and
                      testing guidance.
                    </span>
                  </article>

                  <article class="metric-card">
                    <span class="metric-label"> Deployment Readiness </span>

                    <strong class="shared-feature-status"> Live </strong>

                    <span class="metric-detail">
                      Uses blockers, warnings, findings, recommendations, and
                      readiness scoring.
                    </span>
                  </article>
                </div>
              </section>
            </div>
          </lightning-tab>

          <!-- Findings -->
          <lightning-tab
            label="Findings"
            value="findings"
            icon-name="utility:warning"
          >
            <div class="tab-workspace">
              <section
                class="findings-summary"
                aria-labelledby="findings-summary-title"
              >
                <div class="overview-heading">
                  <p class="eyebrow dark-eyebrow">CURRENT ANALYSIS</p>
                  <h2 id="findings-summary-title" class="section-title">
                    Findings Summary
                  </h2>
                </div>
                <div class="findings-summary-grid">
                  <div>
                    <span>Total Findings</span><strong>{totalFindings}</strong>
                  </div>
                  <div>
                    <span>High / Critical</span
                    ><strong>{highCriticalFindings}</strong>
                  </div>
                  <div>
                    <span>Blocking</span><strong>{blockingFindings}</strong>
                  </div>
                  <div>
                    <span>Categories</span
                    ><strong>{findingCategoryCount}</strong>
                  </div>
                </div>
              </section>

              <template if:true={hasGroupedFindings}>
                <section
                  class="attention-section"
                  aria-labelledby="attention-title"
                >
                  <div class="overview-heading">
                    <h2 id="attention-title" class="section-title">
                      What Needs Attention
                    </h2>
                  </div>
                  <div class="attention-grid">
                    <template for:each={groupedFindings} for:item="category">
                      <article key={category.id} class="attention-item">
                        <strong>{category.category}</strong>
                        <span>{category.findingCount} findings</span>
                        <small
                          >{category.highCount} high · {category.criticalCount}
                          critical · Risk {category.highestSeverity}</small
                        >
                      </article>
                    </template>
                  </div>
                </section>

                <section class="start-here" aria-labelledby="start-here-title">
                  <div>
                    <p class="eyebrow dark-eyebrow">
                      RECOMMENDED STARTING POINT
                    </p>
                    <h2 id="start-here-title">
                      Start Here: {startHereGroup.category}
                    </h2>
                    <p>{startHereGroup.summary}</p>
                  </div>
                  <lightning-button
                    variant="brand"
                    label="Review Category Findings →"
                    onclick={handleStartHere}
                  ></lightning-button>
                </section>
              </template>

              <section
                class="findings-explorer"
                aria-labelledby="explorer-title"
              >
                <div class="explorer-header">
                  <div>
                    <h2 id="explorer-title" class="section-title">
                      Findings Explorer
                    </h2>
                    <p>
                      Filter the current deterministic findings, then expand
                      only the category you need.
                    </p>
                  </div>
                  <div class="finding-filters">
                    <lightning-input
                      type="search"
                      label="Search findings"
                      value={findingsSearchValue}
                      onchange={handleFindingSearch}
                    ></lightning-input>
                    <lightning-combobox
                      label="Category"
                      value={selectedFindingCategory}
                      options={findingCategoryOptions}
                      onchange={handleFindingCategoryChange}
                    ></lightning-combobox>
                  </div>
                </div>

                <template if:true={hasVisibleFindingGroups}>
                  <div class="finding-disclosures">
                    <template
                      for:each={visibleFindingGroups}
                      for:item="category"
                    >
                      <details key={category.id}>
                        <summary>
                          <span>{category.category}</span
                          ><span
                            >{category.visibleCount} findings ·
                            {category.highestSeverity}</span
                          >
                        </summary>
                        <div class="finding-list">
                          <template
                            for:each={category.findings}
                            for:item="finding"
                          >
                            <article
                              key={finding.id}
                              class="finding-item compact-finding"
                            >
                              <div class="finding-heading">
                                <strong>{finding.title}</strong
                                ><span class="severity-badge"
                                  >{finding.severity}</span
                                >
                              </div>
                              <p>{finding.summary}</p>
                              <div class="finding-row-footer">
                                <div class="finding-footer">
                                  <span>{finding.entityApiName}</span
                                  ><span>Impact: -{finding.scoreImpact}</span>
                                </div>
                                <lightning-button
                                  variant="base"
                                  label="Explain This →"
                                  data-id={finding.id}
                                  onclick={handleFindingNavigate}
                                ></lightning-button>
                              </div>
                            </article>
                          </template>
                        </div>
                      </details>
                    </template>
                  </div>
                </template>
                <template if:false={hasVisibleFindingGroups}>
                  <p class="empty-copy">
                    No findings match the current explorer filters.
                  </p>
                </template>
              </section>
            </div>
          </lightning-tab>

          <!-- Metadata Coverage -->
          <lightning-tab
            label="Metadata Coverage"
            value="metadata-coverage"
            icon-name="utility:database"
          >
            <div class="tab-workspace">
              <!-- Detailed metadata coverage -->
              <template if:true={hasMetadataCoverage}>
                <section class="metadata-coverage-section">
                  <c-metadata-coverage-panel coverage={metadataCoverage}>
                  </c-metadata-coverage-panel>
                </section>
              </template>

              <!-- Object scan coverage -->
              <section class="coverage-panel">
                <div>
                  <h2 class="section-title">Object Scan Coverage</h2>

                  <p class="panel-description">
                    {coverageLabel}. This summary measures the object profiles
                    inspected during this scan. The detailed Metadata Coverage
                    panel measures which Salesforce metadata categories are
                    connected.
                  </p>
                </div>

                <div class="coverage-actions">
                  <lightning-button
                    label="Clear Results"
                    icon-name="utility:clear"
                    onclick={handleClear}
                    disabled={isLoading}
                  >
                  </lightning-button>

                  <lightning-button
                    label="Run Again"
                    variant="brand"
                    icon-name="utility:refresh"
                    onclick={handleRunAgain}
                    disabled={isLoading}
                  >
                  </lightning-button>
                </div>
              </section>
            </div>
          </lightning-tab>

          <!-- Daily Brief and Trends -->
          <lightning-tab
            label="Daily Brief & Trends"
            value="daily-brief"
            icon-name="utility:dayview"
          >
            <div class="tab-workspace">
              <!-- Daily Admin Brief -->
              <template if:true={dailyBrief}>
                <section class="daily-brief-panel">
                  <div class="panel-header">
                    <div>
                      <p class="eyebrow dark-eyebrow">Daily Admin Brief</p>

                      <h2 class="section-title">{dailyBrief.greeting}</h2>

                      <p class="panel-description">{dailyBrief.headline}</p>
                    </div>

                    <lightning-icon
                      icon-name="utility:dayview"
                      size="medium"
                      alternative-text="Daily Admin Brief"
                    >
                    </lightning-icon>
                  </div>

                  <div class="brief-summary-grid">
                    <article class="brief-summary-card">
                      <span> Org Health </span>

                      <strong> {dailyBrief.orgHealth.score}/100 </strong>

                      <small> {dailyBrief.orgHealth.status} </small>
                    </article>

                    <article class="brief-summary-card">
                      <span> Deployment </span>

                      <strong>
                        {dailyBrief.deploymentReadiness.score}/100
                      </strong>

                      <small> {dailyBrief.deploymentReadiness.status} </small>
                    </article>

                    <article class="brief-summary-card">
                      <span> Current Findings </span>

                      <strong> {dailyBrief.findings.total} </strong>

                      <small>
                        {dailyBrief.findings.high} high,
                        {dailyBrief.findings.critical} critical
                      </small>
                    </article>
                  </div>

                  <template if:true={hasGroupedFindings}>
                    <div class="brief-priorities">
                      <h3>Current Risk and Improvement Areas</h3>

                      <div class="category-grid">
                        <template
                          for:each={groupedFindings}
                          for:item="category"
                        >
                          <article
                            key={category.category}
                            class="category-card"
                          >
                            <div class="category-heading">
                              <strong> {category.category} </strong>

                              <span class="category-score">
                                {category.findingCount}
                              </span>
                            </div>

                            <div class="category-meta">
                              <span>
                                Score impact: -{category.totalScoreImpact}
                              </span>

                              <span> High: {category.highCount} </span>
                            </div>
                          </article>
                        </template>
                      </div>
                    </div>
                  </template>

                  <template if:true={hasDailyPriorities}>
                    <div class="brief-priorities">
                      <h3>Today’s Recommended Priorities</h3>

                      <ol class="numbered-list">
                        <template
                          for:each={dailyBrief.priorities}
                          for:item="priority"
                        >
                          <li key={priority.rank}>
                            <div>
                              <strong> {priority.title} </strong>

                              <p>{priority.action}</p>

                              <span class="inline-badge">
                                {priority.priority}
                              </span>

                              <span class="inline-category">
                                {priority.category}
                              </span>
                            </div>
                          </li>
                        </template>
                      </ol>
                    </div>
                  </template>

                  <div class="activity-source-note">
                    <lightning-icon
                      icon-name="utility:info"
                      size="xx-small"
                      alternative-text="Activity source"
                    >
                    </lightning-icon>

                    <span>
                      Current priorities and category summaries use the same
                      shared Org Knowledge findings that power Org Health and
                      Deployment Readiness. Verified Salesforce change history
                      will require a future deployment-history data source.
                    </span>
                  </div>
                </section>
              </template>

              <!-- Trend tracking -->
              <section class="content-panel trend-panel">
                <div class="panel-header">
                  <div>
                    <h2 class="section-title">
                      Previous Scan vs. Current Scan
                    </h2>

                    <p class="panel-description">
                      Compares the current results with the previous analysis
                      stored in this browser.
                    </p>
                  </div>

                  <lightning-icon
                    icon-name="utility:trending"
                    size="small"
                    alternative-text="Trend Tracking"
                  >
                  </lightning-icon>
                </div>

                <template if:true={hasTrendData}>
                  <div class="trend-grid">
                    <article class="focus-card">
                      <span class="focus-label"> Org Health Change </span>

                      <strong> {healthTrendLabel} </strong>

                      <p>Current score: {orgHealthDisplay}</p>
                    </article>

                    <article class="focus-card">
                      <span class="focus-label"> Deployment Change </span>

                      <strong> {deploymentTrendLabel} </strong>

                      <p>Current score: {deploymentScoreDisplay}</p>
                    </article>

                    <article class="focus-card">
                      <span class="focus-label"> Finding Change </span>

                      <strong> {findingTrendLabel} </strong>

                      <p>Current findings: {totalFindings}</p>
                    </article>
                  </div>

                  <p class="trend-source-note">
                    Previous result generated: {previousAnalysisLabel}
                  </p>
                </template>

                <template if:false={hasTrendData}>
                  <p class="empty-copy">
                    Run the analysis again to create the first
                    current-versus-previous comparison.
                  </p>
                </template>
              </section>

              <!-- Explainable scoring -->
              <section class="content-panel explanation-panel">
                <div class="panel-header">
                  <div>
                    <p class="eyebrow dark-eyebrow">Explainable Scoring</p>

                    <h2 class="section-title">
                      {healthScoreExplanation.title}
                    </h2>

                    <p class="panel-description">
                      {healthScoreExplanation.summary}
                    </p>
                  </div>

                  <lightning-icon
                    icon-name="utility:info_alt"
                    size="small"
                    alternative-text="Score Explanation"
                  >
                  </lightning-icon>
                </div>

                <template if:true={hasHealthExplanationCategories}>
                  <div class="category-grid">
                    <template
                      for:each={healthExplanationCategories}
                      for:item="category"
                    >
                      <article
                        key={category.category}
                        class="category-card explanation-card"
                      >
                        <div class="category-heading">
                          <strong> {category.category} </strong>

                          <span class="category-score">
                            -{category.totalScoreImpact} points
                          </span>
                        </div>

                        <div class="category-meta">
                          <span> {category.findingCount} findings </span>

                          <span> {category.highCount} high </span>

                          <span> {category.criticalCount} critical </span>
                        </div>
                      </article>
                    </template>
                  </div>
                </template>

                <template if:false={hasHealthExplanationCategories}>
                  <p class="empty-copy">
                    No scoring deductions were generated from the metadata
                    analyzed.
                  </p>
                </template>
              </section>
            </div>
          </lightning-tab>
        </lightning-tabset>
      </template>
    </div>
  </lightning-card>
</template>
