<template>
  <section class="workspace-router">
    <div class="workspace-header">
      <lightning-button
        label="Back to Dashboard"
        icon-name="utility:back"
        onclick={handleBackToDashboard}
      ></lightning-button>
    </div>

    <div class="workspace-container">
      <template if:true={componentConstructor}>
        <lwc:component
          lwc:is={componentConstructor}
          lwc:spread={workspaceProperties}
          onworkspacenavigate={handleWorkspaceNavigate}
        ></lwc:component>
      </template>

      <template if:true={hasRouteError}>
        <div class="route-error" role="alert">{routeError}</div>
      </template>
    </div>
  </section>
</template>
