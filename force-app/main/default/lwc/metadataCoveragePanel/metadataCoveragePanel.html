<template>
    <section class="coverage-panel">

        <template if:true={hasCoverage}>

            <!-- Compact summary header -->
            <div class="panel-header">
                <div>
                    <p class="eyebrow">
                        Analysis Transparency
                    </p>

                    <h2 class="panel-title">
                        Metadata Coverage
                    </h2>

                    <p class="panel-description">
                        Shows which planned Salesforce metadata categories
                        are connected to the intelligence engine.
                    </p>
                </div>

                <div class="score-summary">
                    <div class="score-value">
                        {scoreDisplay}
                    </div>

                    <span class={coverageStatusClass}>
                        {status}
                    </span>
                </div>
            </div>

            <!-- Coverage progress -->
            <div class="coverage-progress">
                <div class="progress-track">
                    <div
                        class="progress-fill"
                        style={coverageStyle}>
                    </div>
                </div>

                <div class="progress-meta">
                    <span>
                        <strong>{completeCategories}</strong>
                        collected
                    </span>

                    <span>
                        <strong>{partialCategories}</strong>
                        partial
                    </span>

                    <span>
                        <strong>{missingCategories}</strong>
                        missing
                    </span>

                    <span>
                        <strong>{totalCategories}</strong>
                        total
                    </span>
                </div>
            </div>

            <!-- Compact summary -->
            <div class="summary-box">
                <lightning-icon
                    icon-name="utility:info_alt"
                    size="x-small"
                    alternative-text="Coverage summary">
                </lightning-icon>

                <p>{summary}</p>
            </div>

            <!-- Next collection step -->
            <template if:true={hasNextCollectionStep}>
                <section class="next-step-panel">
                    <div class="next-step-icon">
                        <lightning-icon
                            icon-name="utility:forward"
                            size="small"
                            alternative-text="Next collection step">
                        </lightning-icon>
                    </div>

                    <div class="next-step-content">
                        <span class="next-step-label">
                            Next Recommended Target
                        </span>

                        <div class="next-step-heading">
                            <h3>
                                {nextCollectionLabel}
                            </h3>

                            <template if:true={nextCollectionPhase}>
                                <span class="phase-badge">
                                    {nextCollectionPhase}
                                </span>
                            </template>
                        </div>

                        <p>
                            {nextCollectionReason}
                        </p>
                    </div>
                </section>
            </template>

            <!-- Progressive disclosure -->
            <lightning-accordion
                allow-multiple-sections-open
                active-section-name="">

                <!-- Collected -->
                <lightning-accordion-section
                    name="collected"
                    label="Collected">

                    <div class="accordion-summary">
                        <span>
                            {completeCategories} metadata categories are
                            fully available.
                        </span>
                    </div>

                    <template if:true={hasCompletedCategories}>
                        <div class="compact-category-list">
                            <template
                                for:each={completedCategoryCoverage}
                                for:item="category">

                                <article
                                    key={category.id}
                                    class="compact-category-row">

                                    <div class="compact-category-main">
                                        <div>
                                            <h4>
                                                {category.label}
                                            </h4>

                                            <span class={category.statusClass}>
                                                {category.status}
                                            </span>
                                        </div>

                                        <strong>
                                            {category.completionDisplay}
                                        </strong>
                                    </div>

                                    <div class="compact-category-meta">
                                        <span>
                                            {category.weightDisplay}
                                        </span>

                                        <span>
                                            {category.itemCountDisplay}
                                        </span>
                                    </div>

                                    <details class="category-details-toggle">
                                        <summary>
                                            View details
                                        </summary>

                                        <div class="category-expanded-details">
                                            <p>
                                                {category.description}
                                            </p>

                                            <template if:true={category.enables}>
                                                <div class="enables-list">
                                                    <span class="details-label">
                                                        Enables
                                                    </span>

                                                    <template
                                                        for:each={category.enables}
                                                        for:item="feature">

                                                        <span
                                                            key={feature}
                                                            class="feature-chip">
                                                            {feature}
                                                        </span>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </details>
                                </article>
                            </template>
                        </div>
                    </template>

                    <template if:false={hasCompletedCategories}>
                        <p class="empty-copy">
                            No metadata categories are fully collected yet.
                        </p>
                    </template>
                </lightning-accordion-section>

                <!-- Partial -->
                <lightning-accordion-section
                    name="partial"
                    label="Partially Collected">

                    <div class="accordion-summary">
                        <span>
                            {partialCategories} categories contain some
                            metadata but are not fully verified.
                        </span>
                    </div>

                    <template if:true={hasPartialCategories}>
                        <div class="compact-category-list">
                            <template
                                for:each={partialCategoryCoverage}
                                for:item="category">

                                <article
                                    key={category.id}
                                    class="compact-category-row partial-row">

                                    <div class="compact-category-main">
                                        <div>
                                            <h4>
                                                {category.label}
                                            </h4>

                                            <span class={category.statusClass}>
                                                {category.status}
                                            </span>
                                        </div>

                                        <strong>
                                            {category.completionDisplay}
                                        </strong>
                                    </div>

                                    <div class="compact-category-meta">
                                        <span>
                                            {category.weightDisplay}
                                        </span>

                                        <span>
                                            {category.itemCountDisplay}
                                        </span>
                                    </div>

                                    <details class="category-details-toggle">
                                        <summary>
                                            View limitation
                                        </summary>

                                        <div class="category-expanded-details">
                                            <p>
                                                {category.description}
                                            </p>

                                            <template
                                                if:true={category.limitation}>

                                                <div class="limitation-note">
                                                    <lightning-icon
                                                        icon-name="utility:warning"
                                                        size="xx-small"
                                                        alternative-text="Limitation">
                                                    </lightning-icon>

                                                    <span>
                                                        {category.limitation}
                                                    </span>
                                                </div>
                                            </template>
                                        </div>
                                    </details>
                                </article>
                            </template>
                        </div>
                    </template>

                    <template if:false={hasPartialCategories}>
                        <p class="empty-copy">
                            No categories are partially collected.
                        </p>
                    </template>
                </lightning-accordion-section>

                <!-- Missing -->
                <lightning-accordion-section
                    name="missing"
                    label="Not Yet Connected">

                    <div class="accordion-summary">
                        <span>
                            {missingCategories} planned categories are not
                            connected to the current analysis.
                        </span>
                    </div>

                    <template if:true={hasMissingCategories}>
                        <div class="compact-category-list">
                            <template
                                for:each={missingCategoryCoverage}
                                for:item="category">

                                <article
                                    key={category.id}
                                    class="compact-category-row muted-row">

                                    <div class="compact-category-main">
                                        <div>
                                            <h4>
                                                {category.label}
                                            </h4>

                                            <span class={category.statusClass}>
                                                {category.status}
                                            </span>
                                        </div>

                                        <strong>
                                            {category.completionDisplay}
                                        </strong>
                                    </div>

                                    <div class="compact-category-meta">
                                        <span>
                                            {category.weightDisplay}
                                        </span>

                                        <span>
                                            Phase: {category.phase}
                                        </span>
                                    </div>

                                    <details class="category-details-toggle">
                                        <summary>
                                            View future capabilities
                                        </summary>

                                        <div class="category-expanded-details">
                                            <p>
                                                {category.description}
                                            </p>

                                            <template if:true={category.enables}>
                                                <div class="enables-list">
                                                    <span class="details-label">
                                                        Will enable
                                                    </span>

                                                    <template
                                                        for:each={category.enables}
                                                        for:item="feature">

                                                        <span
                                                            key={feature}
                                                            class="feature-chip future-chip">
                                                            {feature}
                                                        </span>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </details>
                                </article>
                            </template>
                        </div>
                    </template>

                    <template if:false={hasMissingCategories}>
                        <p class="empty-copy">
                            All planned metadata categories are connected.
                        </p>
                    </template>
                </lightning-accordion-section>

                <!-- Limitations -->
                <template if:true={hasLimitations}>
                    <lightning-accordion-section
                        name="limitations"
                        label="Known Limitations">

                        <div class="accordion-summary">
                            <span>
                                Review what the current analysis does not yet
                                verify.
                            </span>
                        </div>

                        <div class="compact-limitations">
                            <div class="limitations-header">
                                <lightning-icon
                                    icon-name="utility:warning"
                                    size="small"
                                    alternative-text="Known limitations">
                                </lightning-icon>

                                <div>
                                    <h3>
                                        Analysis Limitations
                                    </h3>

                                    <p>
                                        These items explain where current
                                        scores may be incomplete.
                                    </p>
                                </div>
                            </div>

                            <ul class="limitations-list">
                                <template
                                    for:each={limitations}
                                    for:item="limitation">

                                    <li key={limitation.id}>
                                        {limitation.text}
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </lightning-accordion-section>
                </template>

            </lightning-accordion>

            <!-- Footer -->
            <footer class="coverage-footer">
                <span>
                    Calculated:
                    {generatedAtLabel}
                </span>

                <span>
                    Coverage measures collection completeness,
                    not Org Health.
                </span>
            </footer>
        </template>

        <!-- Empty state -->
        <template if:false={hasCoverage}>
            <section class="empty-state">
                <lightning-icon
                    icon-name="utility:database"
                    size="large"
                    alternative-text="Metadata Coverage">
                </lightning-icon>

                <h2>
                    Metadata Coverage Not Available
                </h2>

                <p>
                    Run the Salesforce Metadata Collector to calculate
                    coverage across the planned metadata categories.
                </p>
            </section>
        </template>

    </section>
</template>
