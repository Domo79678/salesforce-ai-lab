<template>
  <section class="workspace">
    <header>
      <p class="eyebrow">Consultant planning workflow</p>
      <h1>Ask Before You Build</h1>
      <p>
        Frame the business problem, affected users, design considerations, and
        testing expectations before configuring Salesforce.
      </p>
      <lightning-badge label="Deterministic guidance"></lightning-badge>
    </header>

    <div class="steps">
      <article class="step-card">
        <span class="step-number">1</span>
        <lightning-combobox
          label="Select change type"
          value={changeType}
          options={changeTypeOptions}
          onchange={handleChangeType}
          required
        ></lightning-combobox>
      </article>

      <article class="step-card">
        <span class="step-number">2</span>
        <lightning-textarea
          label="Describe the business problem"
          value={businessProblem}
          onchange={handleBusinessProblem}
          placeholder="Describe the outcome, constraint, and why the change is needed."
          required
        ></lightning-textarea>
      </article>

      <article class="step-card">
        <span class="step-number">3</span>
        <lightning-checkbox-group
          name="affectedUsers"
          label="Select affected users"
          options={userOptions}
          value={affectedUsers}
          onchange={handleAffectedUsers}
          required
        ></lightning-checkbox-group>
      </article>
    </div>

    <section class="discovery-inputs" aria-labelledby="discovery-input-title">
      <div class="discovery-input-heading">
        <p class="eyebrow">Optional discovery details</p>
        <h2 id="discovery-input-title">Teach the coach what you know</h2>
        <p>
          Add details as they become known. The Consultant Lens will identify
          remaining discovery gaps before recommending a design direction.
        </p>
      </div>
      <div class="discovery-input-grid">
        <lightning-textarea
          label="Desired business outcome"
          data-field="desiredOutcome"
          value={desiredOutcome}
          onchange={handleDiscoveryField}
        ></lightning-textarea>
        <lightning-textarea
          label="Current process"
          data-field="currentProcess"
          value={currentProcess}
          onchange={handleDiscoveryField}
        ></lightning-textarea>
        <lightning-textarea
          label="Stakeholders / decision owners"
          data-field="stakeholders"
          value={stakeholders}
          onchange={handleDiscoveryField}
        ></lightning-textarea>
        <lightning-textarea
          label="Pain points"
          data-field="painPoints"
          value={painPoints}
          onchange={handleDiscoveryField}
        ></lightning-textarea>
        <lightning-textarea
          label="Business rules and exceptions"
          data-field="businessRules"
          value={businessRules}
          onchange={handleDiscoveryField}
        ></lightning-textarea>
        <lightning-textarea
          label="Constraints"
          data-field="constraints"
          value={constraints}
          onchange={handleDiscoveryField}
        ></lightning-textarea>
        <lightning-textarea
          label="Success measures"
          data-field="successMetrics"
          value={successMetrics}
          onchange={handleDiscoveryField}
        ></lightning-textarea>
        <lightning-textarea
          label="Known risks / assumptions"
          data-field="risks"
          value={risks}
          onchange={handleDiscoveryField}
        ></lightning-textarea>
        <lightning-textarea
          label="Open questions"
          data-field="openQuestions"
          value={openQuestions}
          onchange={handleDiscoveryField}
        ></lightning-textarea>
      </div>
    </section>

    <lightning-button
      label="Review Before Building"
      variant="brand"
      icon-name="utility:choice"
      onclick={buildGuidance}
    ></lightning-button>

    <template if:true={hasError}>
      <div class="error" role="alert">{errorMessage}</div>
    </template>

    <template if:true={hasDiscovery}>
      <section class="consultant-lens" aria-live="polite">
        <div class="lens-heading">
          <p class="eyebrow">Consultant Lens</p>
          <h2>Understand the problem before choosing a solution</h2>
        </div>

        <div class="lens-grid">
          <article class="lens-card outcome-card">
            <h3>Business Outcome</h3>
            <p>{businessOutcome}</p>
          </article>
          <article class="lens-card">
            <h3>What We Know</h3>
            <ul>
              <template for:each={whatWeKnowRows} for:item="item">
                <li key={item.id}>{item.label}</li>
              </template>
            </ul>
          </article>
          <article class="lens-card gap-card">
            <h3>What We Still Need to Learn</h3>
            <ul>
              <template for:each={missingDiscoveryRows} for:item="item">
                <li key={item.id}>{item.label}</li>
              </template>
            </ul>
          </article>
          <article class="lens-card">
            <h3>Discovery Questions</h3>
            <ul>
              <template for:each={discoveryQuestionRows} for:item="item">
                <li key={item.id}>{item.label}</li>
              </template>
            </ul>
          </article>
          <article class="lens-card">
            <h3>Risks / Assumptions</h3>
            <ul>
              <template for:each={discoveryRiskRows} for:item="item">
                <li key={item.id}>{item.label}</li>
              </template>
            </ul>
          </article>
          <article class="lens-card">
            <h3>Success Measures</h3>
            <ul>
              <template for:each={successMeasureRows} for:item="item">
                <li key={item.id}>{item.label}</li>
              </template>
            </ul>
          </article>
          <article class="lens-card readiness-card">
            <h3>Ready to Design?</h3>
            <p class="readiness-status">{readinessStatus}</p>
            <p>{readinessScore}% of critical discovery defined.</p>
            <p>{readinessExplanation}</p>
          </article>
        </div>
      </section>
    </template>

    <template if:true={hasGuidance}>
      <section class="results" aria-live="polite">
        <article class="result-card feature-card">
          <p class="eyebrow">Recommended Salesforce feature</p>
          <h2>{guidance.recommendedFeature}</h2>
          <p>
            This recommendation is based on the selected change type. Use the
            considerations below to validate that choice against the business
            problem.
          </p>
        </article>

        <article class="result-card">
          <h2>Consultant Considerations</h2>
          <ul>
            <template for:each={considerationRows} for:item="item">
              <li key={item.id}>{item.label}</li>
            </template>
          </ul>
        </article>

        <article class="result-card">
          <h2>Testing Checklist</h2>
          <ul>
            <template for:each={testRows} for:item="item">
              <li key={item.id}>{item.label}</li>
            </template>
          </ul>
        </article>

        <article class="result-card">
          <h2>Related Workspaces</h2>
          <div class="workspace-links">
            <template for:each={relatedWorkspaceRows} for:item="item">
              <lightning-button
                key={item.moduleName}
                label={item.label}
                icon-name={item.iconName}
                data-module={item.moduleName}
                onclick={handleWorkspaceNavigate}
              ></lightning-button>
            </template>
          </div>
        </article>
      </section>
    </template>
  </section>
</template>
