<template>
  <div class="workspace">
    <section class="hero" aria-labelledby="explain-this-title">
      <div class="hero-left">
        <p class="eyebrow">SALESFORCE COPILOT</p>
        <h1 id="explain-this-title">Explain This</h1>
        <p class="subtitle">
          Investigate Salesforce metadata, understand its purpose and risk, and
          decide what to do next.
        </p>
      </div>
    </section>

    <template if:true={hasLaunchContext}>
      <section class="context-banner" aria-labelledby="selected-issue-title">
        <div>
          <p class="eyebrow">Selected Issue</p>
          <h2 id="selected-issue-title">{selectedIssueTitle}</h2>
          <p>{selectedIssueReason}</p>
          <span>Source: {selectedIssueSource}</span>
        </div>
        <lightning-button
          label="Start New Explanation"
          onclick={handleStartNewExplanation}
        >
        </lightning-button>
      </section>
    </template>

    <section class="search-panel" aria-label="Metadata investigation search">
      <lightning-input
        type="search"
        label="Search Salesforce Metadata"
        placeholder="Opportunity, Opportunity.Amount, Account, Case..."
        value={searchValue}
        onchange={handleSearchChange}
      >
      </lightning-input>

      <div class="button-row">
        <lightning-button
          variant="brand"
          label="Explain"
          disabled={explainButtonDisabled}
          onclick={handleExplain}
        >
        </lightning-button>
      </div>
    </section>

    <template if:true={hasError}>
      <section class="error-panel" role="alert" aria-live="polite">
        <h2>Explanation unavailable</h2>
        <p>{errorMessage}</p>
      </section>
    </template>

    <template if:true={isLoading}>
      <div class="loading-panel">
        <lightning-spinner size="medium" alternative-text="Analyzing Metadata">
        </lightning-spinner>
      </div>
    </template>

    <template if:true={hasExplanation}>
      <section class="summary-bar" aria-label="Analysis snapshot">
        <div class="summary-card">
          <span class="summary-title"> Metadata Source </span>

          <span class="summary-value"> {metadataSource} </span>
        </div>

        <div class="summary-card">
          <span class="summary-title"> Confidence </span>

          <span class="summary-value"> {confidence}% </span>
        </div>

        <div class="summary-card">
          <span class="summary-title"> Dependencies </span>

          <span class="summary-value"> {dependencyCount} </span>
        </div>

        <div class="summary-card summary-card-risk">
          <span class="summary-title"> Risk </span>

          <span class="summary-value"> {riskLevel} </span>
        </div>
      </section>

      <template if:true={hasResolutionGuidance}>
        <section class="recommended-action" aria-labelledby="action-title">
          <div class="action-heading">
            <div>
              <p class="eyebrow">DETERMINISTIC GUIDANCE</p>
              <h2 id="action-title">Recommended Action</h2>
              <p>
                Review this rules-based resolution path before changing
                metadata.
              </p>
            </div>
            <lightning-button
              variant="brand"
              label="Track This Action"
              onclick={handleTrackAction}
            ></lightning-button>
          </div>

          <div class="action-grid">
            <article>
              <h3>Recommended Approach</h3>
              <p>{recommendedApproach}</p>
            </article>
            <article>
              <h3>What to Review First</h3>
              <p>{reviewFirst}</p>
            </article>
            <article>
              <h3>Avoid This</h3>
              <p>{doNotDo}</p>
            </article>
          </div>
        </section>
      </template>

      <section
        class="core-explanation"
        aria-labelledby="core-explanation-title"
      >
        <div class="section-heading">
          <p class="eyebrow">CORE EXPLANATION</p>
          <h2 id="core-explanation-title">What this means</h2>
        </div>
        <div class="core-grid">
          <article class="explanation-panel">
            <h2>Business Purpose</h2>
            <p>{businessPurpose}</p>
          </article>
          <article class="explanation-panel">
            <h2>Technical Explanation</h2>
            <p>{technicalExplanation}</p>
          </article>
        </div>
      </section>

      <section class="more-detail" aria-labelledby="more-detail-title">
        <div class="section-heading">
          <p class="eyebrow">SUPPORTING ANALYSIS</p>
          <h2 id="more-detail-title">More Detail</h2>
          <p>Open only the evidence needed for your investigation.</p>
        </div>
        <div class="disclosure-list">
          <details>
            <summary>Dependencies</summary>
            <div class="detail-content">
              <h3>Dependencies to Check</h3>
              <p>{dependenciesToCheck}</p>
              <h3>Observed Metadata Dependencies</h3>
              <p>{dependencySummary}</p>
            </div>
          </details>
          <details>
            <summary>Risk Analysis</summary>
            <div class="detail-content"><p>{riskSummary}</p></div>
          </details>
          <details>
            <summary>Testing Guidance</summary>
            <div class="detail-content">
              <h3>Resolution Test Plan</h3>
              <p>{resolutionTestPlan}</p>
              <h3>Metadata Test Evidence</h3>
              <p>{testingGuidance}</p>
            </div>
          </details>
          <details>
            <summary>Deployment Considerations</summary>
            <div class="detail-content">
              <h3>Resolution Guidance</h3>
              <p>{resolutionDeploymentConsiderations}</p>
              <h3>Deployment Evidence</h3>
              <p>{deploymentNotes}</p>
            </div>
          </details>
          <details>
            <summary>Suggested Improvements</summary>
            <div class="detail-content"><p>{recommendations}</p></div>
          </details>
          <details>
            <summary>Interview Explanation</summary>
            <div class="detail-content"><p>{interviewGuidance}</p></div>
          </details>
        </div>
      </section>
    </template>
  </div>
</template>
